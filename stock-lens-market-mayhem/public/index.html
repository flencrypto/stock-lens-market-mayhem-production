<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00e5ff" />
  <title>Mr.FLEN Stock-LENS: Market Mayhem</title>
  <meta name="description" content="Turn-based fantasy market game. Start with $1,000. One trade per day. Climb the leaderboard." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    window.__STOCKLENS_BOOT_TIME__ = Date.now();
    window.__fbInstantReady = false;
  </script>
  <script async src="https://connect.facebook.net/en_US/fbinstant.8.0.js" onload="window.__fbInstantReady=true" onerror="window.__fbInstantReady=false"></script>
</head>
<body>
  <noscript>
    <main class="noscript-card">
      <h1>Mr.FLEN Stock-LENS</h1>
      <p>This game needs JavaScript enabled.</p>
    </main>
  </noscript>

  <div id="app" class="app-shell" aria-live="polite">
    <section class="loading-screen">
      <div class="loading-card">
        <img src="/assets/icon.svg" alt="Stock-LENS logo" class="loading-logo" />
        <p class="eyebrow">Mr.FLEN presents</p>
        <h1>Stock-LENS<br><span>Market Mayhem</span></h1>
        <div class="progress-rail"><div id="boot-progress" class="progress-bar"></div></div>
        <p id="boot-status">Loading market lenses...</p>
      </div>
    </section>
  </div>

  <template id="app-template">
    <header class="topbar">
      <button class="brand" data-route="dashboard" aria-label="Open dashboard">
        <img src="/assets/icon.svg" alt="" />
        <span><strong>Mr.FLEN</strong><em>STOCK-LENS</em></span>
      </button>
      <div class="topbar-actions">
        <button class="ghost-button compact" id="install-button" hidden>Install App</button>
        <button class="ghost-button compact" id="share-button">Share</button>
      </div>
    </header>

    <main>
      <section class="hero-panel">
        <div class="hero-copy">
          <p class="eyebrow">One trade per day · $1,000 virtual bankroll</p>
          <h1>Markets don’t make sense. <span>LENS does.</span></h1>
          <p>Make one virtual trade, survive the market, then challenge your mates in Stock-TRUMPS.</p>
          <div class="hero-actions">
            <button class="primary-button" data-route="trade">Make today’s trade</button>
            <button class="secondary-button" data-route="trumps">Stock-TRUMPS battle</button>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <img src="/assets/stock-lens-branding.jpeg" alt="" />
          <div class="hero-art-glow"></div>
        </div>
      </section>

      <nav class="tabbar" aria-label="Game sections">
        <button data-route="dashboard" class="active">Dashboard</button>
        <button data-route="trade">Trade</button>
        <button data-route="leaderboard">Leaderboard</button>
        <button data-route="trumps">Stock-TRUMPS</button>
        <button data-route="profile">Profile</button>
      </nav>

      <section id="view" class="view"></section>
    </main>

    <aside id="toast" class="toast" hidden></aside>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
